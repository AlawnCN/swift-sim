<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>登录 - SWIFT 模拟器管理端</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b3d5c;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
form{background:#fff;padding:28px 32px;border-radius:8px;width:320px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
h1{font-size:18px;margin:0 0 4px}p{color:#666;font-size:12px;margin:0 0 18px}
label{display:block;font-size:13px;margin:10px 0 4px}input{width:100%;box-sizing:border-box;padding:7px;border:1px solid #c5ccd3;border-radius:4px;font:inherit}
button{margin-top:18px;width:100%;padding:8px;background:#0b3d5c;color:#fff;border:0;border-radius:4px;font:inherit;cursor:pointer}
#err{color:#c00;font-size:12px;min-height:16px;margin-top:10px}
</style></head><body>
<form id="f"><h1>SWIFT 模拟器管理端</h1><p>账号密码见服务器文件 <code>config/secrets/admin-console.properties</code></p>
<label>用户名</label><input id="u" value="admin" autocomplete="username">
<label>密码</label><input id="p" type="password" autocomplete="current-password" autofocus>
<button>登录</button><div id="err"></div></form>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='';
 const r=await fetch('/admin/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});
 if(r.ok){location.href='/admin/';return;} const j=await r.json().catch(()=>({}));err.textContent=r.status==429?'失败次数过多，请 5 分钟后再试':'用户名或密码错误';};
</script></body></html>
